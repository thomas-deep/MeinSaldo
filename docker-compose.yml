# MeinSaldo — Docker-Compose-Setup für lokale Nutzung.
#
# Start:        docker compose up -d
# Logs:         docker compose logs -f meinsaldo
# Stop:         docker compose down
# Update:       docker compose pull && docker compose up -d --build
#
# Daten:        liegen im benannten Volume `meinsaldo-data` (überlebt down/up).
#               Sicherung: `docker run --rm -v meinsaldo-data:/data -v $PWD:/backup
#                            alpine tar czf /backup/meinsaldo-backup.tgz /data`

services:
  meinsaldo:
    build: .
    image: meinsaldo:local
    container_name: meinsaldo
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # CSRF-Allowlist — auf abweichendem Host/Port anpassen
      ALLOWED_ORIGINS: "http://localhost:3000,http://127.0.0.1:3000"
      # KI-Host-Allowlist:
      #   "ollama"              → Compose-interner Service (Default)
      #   "host.docker.internal" → Ollama läuft direkt auf deinem Host
      ALLOWED_OLLAMA_HOSTS: "localhost,127.0.0.1,::1,ollama,host.docker.internal"
    volumes:
      - meinsaldo-data:/data
    # macht http://host.docker.internal:11434 aus dem Container erreichbar —
    # auf Docker Desktop ohnehin Standard, auf Linux nötig (host-gateway).
    extra_hosts:
      - "host.docker.internal:host-gateway"

  # Lokaler KI-Dienst für die Kategorisierung — startet standardmäßig mit.
  # Wer Ollama schon auf dem Host laufen hat und keinen zweiten Container
  # braucht: einfach `docker compose up -d meinsaldo` (Service explizit
  # nennen → ollama bleibt aus) und in MeinSaldo
  #   Ollama-URL: http://host.docker.internal:11434
  # konfigurieren.
  ollama:
    image: ollama/ollama:latest
    container_name: meinsaldo-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    # Standardmäßig kein Port-Mapping nach außen — Ollama bleibt im internen
    # Compose-Netz erreichbar als http://ollama:11434. Wer auch vom Host darauf
    # zugreifen möchte, entkommentiert das Mapping:
    # ports:
    #   - "11434:11434"

volumes:
  meinsaldo-data:
  ollama-data:
