name: Docker-Image bauen und nach GHCR pushen

# Veröffentlicht Multi-Arch-Images (linux/amd64 + linux/arm64) der App
# in die GitHub Container Registry. Damit können Endnutzer auf Synology,
# UGreen und anderen NAS-Geräten das Image direkt ziehen, ohne lokal zu
# bauen.
#
# Tag-Strategie (via docker/metadata-action):
#   Push auf main         → ghcr.io/<owner>/meinsaldo:edge
#   Git-Tag v0.2.0        → :0.2.0, :0.2, :latest
#   Beliebige Builds      → :sha-<7-stellig> (Reproduzierbarkeit)
#
# Einmalig in Repo-Settings → Packages: Image-Visibility auf 'Public' stellen,
# damit anonymes `docker pull` für Endnutzer ohne Login funktioniert.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "app/**"
      - "Dockerfile"
      - ".github/workflows/docker-publish.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/meinsaldo

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: QEMU für Multi-Arch-Emulation
        uses: docker/setup-qemu-action@v3

      - name: Buildx-Builder
        uses: docker/setup-buildx-action@v3

      - name: GHCR-Login
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image-Metadaten (Tags + Labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tag-Erzeugung:
          #   - 'edge' für main-Pushes (nicht :latest, damit NAS-Nutzer
          #     mit :latest nicht unfreiwillig instabile Versionen ziehen)
          #   - SemVer-Tags aus Git-Tags vX.Y.Z → X.Y.Z, X.Y, latest
          #   - Kurz-SHA für jeden Build (Reproduzierbarkeit)
          tags: |
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=MeinSaldo
            org.opencontainers.image.description=Lokale Web-App zur Aufbereitung deutscher Bankkonto-CSV-Exporte
            org.opencontainers.image.licenses=MIT

      - name: Build + Push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Buildx-Cache über die Action — beschleunigt Folge-Builds spürbar,
          # gerade bei der QEMU-emulierten arm64-Variante.
          cache-from: type=gha
          cache-to: type=gha,mode=max
